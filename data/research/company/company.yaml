# Research area: starting a private limited company in Karnataka, India (second rule pack).
# Every fact cites a saved source (data/sources/index.json). Units: the planner must not mix them.
#   - GSTIN: 7 WORKING days (CGST Rule 9(1)); 30 days if physical verification (Rule 9(1) proviso, unit not "working").
#   - Shops & Establishments (KA): 7 WORKING days (Sakala compendium 05-05-2026, Labour Dept row 1).
#   - Professional tax registration (KA): 30 CALENDAR days ("thirty days") in s.5(3) of the KA PT Act 1976; source is
#     the PRS Legislative Research copy (secondary): indiacode.nic.in returned HTTP 403 and pt.kar.nic.in was unreachable.
#   - MCA incorporation (SPICe+), DIN, company PAN/TAN, DSC, bank account: no official processing time found -> null.
# mca.gov.in returns HTTP 403 to the research fetcher, so the SPICe+ FAQ is a Wayback Machine copy of the mca.gov.in PDF.
offices:
  - id: mca-registrar-of-companies
    name: Registrar of Companies / Central Registration Centre (CRC), Ministry of Corporate Affairs (SPICe+ on MCA portal)
    level: national
  - id: income-tax-dept
    name: Income Tax Department, Government of India (company PAN/TAN allotted through SPICe+; individual e-PAN)
    level: national
  - id: certifying-authority-cca
    name: Certifying Authority licensed by the Controller of Certifying Authorities (CCA), MeitY
    level: national
  - id: gst-proper-officer
    name: GST proper officer (registration on the GST common portal, gst.gov.in)
    level: state
  - id: labour-inspector-ka
    name: Labour Inspector / Senior Labour Inspector, Department of Labour, Karnataka (e-Karmika)
    level: district
  - id: pt-assessing-authority-ka
    name: Assessing authority under the Karnataka Tax on Professions Act, 1976 (Commercial Taxes, Karnataka)
    level: state
  - id: bank-branch
    name: Bank branch (regulated entity under RBI KYC Master Direction)
    level: bank
  - id: property-owner
    name: Owner of the registered office premises (gives NOC / lease deed / rent agreement)
    level: institution
  - id: uidai-enrolment-centre
    name: Aadhaar enrolment centre (UIDAI; also at Atalji Janasnehi Kendras in Karnataka)
    level: national

documents:
  - id: co-dsc
    name: Digital Signature Certificate (DSC) of each subscriber / director
    office: certifying-authority-cca
    office_cite: {source_id: cca-how-to-get-dsc, excerpt: "One can approach any one of the Licensed CAs for getting a Digital Signature Certificate.", confidence: official}
    days: null
    note: >-
      No official issue time found. CCA itself does not issue DSCs to end users. Document/identity requirements of the
      CAs (CCA identity verification guidelines) were not captured, so no prerequisites are modelled.
    requires: []

  - id: co-registered-office-proof
    name: Registered office proof (utility bill not older than two months + NOC / lease deed / rent agreement)
    office: property-owner
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "The NOC/Lease Deed/ Rent Agreement is not provided by the owner.", confidence: official}
    days: null
    note: Not issued by a government office; the owner of the premises provides it. Listed in SPICe+ FAQ 45(c) and 58.
    requires: []

  - id: co-moa-aoa
    name: Memorandum and Articles of Association (eMoA INC-33 / eAoA INC-34, linked forms to SPICe+)
    office: mca-registrar-of-companies
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "eMoA and eAoA have to be uploaded as ‘Linked Forms’ to SPICe+ (INC-32)", confidence: official}
    days: null
    note: Drafted by the founders and filed with SPICe+; no separate processing time.
    requires: []

  - id: aadhaar
    name: Aadhaar number of the director / owner (UIDAI)
    office: uidai-enrolment-centre
    office_cite: {source_id: ajsk-faqs, excerpt: "YES Aadhar Enrolment at AJSK is free of Cost.", confidence: official}
    days: null
    note: Personal document of the founder; its own prerequisites are modelled in the scholarships pack, not here.
    requires: []

  - id: pan-card
    name: Personal PAN of each director / subscriber (Instant e-PAN via Aadhaar)
    office: income-tax-dept
    office_cite: {source_id: itd-instant-epan-help, excerpt: "Instant e-PAN is a free, pre-login service on the e-Filing portal", confidence: official}
    days: null
    note: No processing time stated on the official page.
    requires:
      - doc: aadhaar
        cite: {source_id: itd-instant-epan-help, excerpt: "A valid Aadhaar number.", confidence: official}

  - id: co-spice-incorporation-certificate
    name: Certificate of Incorporation (CIN) via SPICe+ (INC-32)
    office: mca-registrar-of-companies
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Application for issuance of Corporate Identification Number / Registration of Company with Registrar of Company", confidence: official}
    days: null
    note: >-
      No official processing time found in the MCA SPICe+ FAQ (mca.gov.in itself, including the Companies
      (Incorporation) Rules, returned HTTP 403). A reserved name is held 20 days from approval (FAQ 21). SPICe+ also
      carries AGILE-PRO-S (GSTIN optional, EPFO/ESIC, Karnataka professional tax, bank account opening).
    requires:
      - doc: co-moa-aoa
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "The following documents are required to be enclosed: a) Memorandum of Association b) Articles of Association", confidence: official}
      - doc: co-registered-office-proof
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Copy of the utility bills (not older than two months)Proof of Office address along with NOC, if applicable(Conveyance/lease deed/Rent Agreement along with rent receipts);", confidence: official}
      - doc: co-dsc
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "it shall be mandatory for each one of them to obtain a DSC.", confidence: official}
      - doc: pan-card
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "PAN Card of the Subscribers/Directors (not having DIN) is not attached.", confidence: official}
        note: A ground for rejection of SPICe+ (FAQ 61), for subscribers/directors who do not yet have a DIN.

  - id: co-din
    name: Director Identification Number (DIN) for first directors, allotted through SPICe+
    office: mca-registrar-of-companies
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Application for allotment of Director Identification Number (DIN) / Registration of Director", confidence: official}
    days: null
    note: Up to 3 new DINs per SPICe+ (FAQ 37). Allotted when SPICe+ is approved; no separate time stated.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Once DIN is allocated for first directors post approval of SPICe+", confidence: official}
        note: DIN is allotted on approval of the same SPICe+ application, together with the Certificate of Incorporation.
      - doc: pan-card
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "PAN Card of the Subscribers/Directors (not having DIN) is not attached.", confidence: official}

  - id: co-company-pan
    name: PAN of the company (allotted with the Certificate of Incorporation)
    office: income-tax-dept
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "the Certificate of Incorporation (Col) is issued with PAN as allotted by the Income Tax Department.", confidence: official}
    days: null
    note: Issued at the same moment as the Certificate of Incorporation; the PAN card follows from the Income Tax Department.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "On approval of SPICe+ forms, the Certificate of Incorporation (Col) is issued with PAN as allotted by the Income Tax Department.", confidence: official}

  - id: co-company-tan
    name: TAN of the company (allotted through SPICe+)
    office: income-tax-dept
    office_cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "An electronic mail with Certificate of Incorporation (Col) as an attachment along with PAN and TAN is also sent to the user.", confidence: official}
    days: null
    note: Sent with the Certificate of Incorporation; no separate time stated.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "An electronic mail with Certificate of Incorporation (Col) as an attachment along with PAN and TAN is also sent to the user.", confidence: official}

  - id: co-bank-current-account
    name: Company bank account
    office: bank-branch
    office_cite: {source_id: rbi-kyc-md, excerpt: "For opening an account of a company, certified copies of each of the following documents", confidence: official}
    days: null
    note: >-
      No official opening time. Applying for the account through AGILE-PRO-S is mandatory for SPICe+ companies (FAQ 40).
      RBI also requires a board resolution, KYC of beneficial owners and authorised persons (not modelled as documents).
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: rbi-kyc-md, excerpt: "the following documents or the equivalent e-documents thereof shall be obtained: Certificate of incorporation Memorandum and Articles of Association", confidence: official}
      - doc: co-moa-aoa
        cite: {source_id: rbi-kyc-md, excerpt: "the following documents or the equivalent e-documents thereof shall be obtained: Certificate of incorporation Memorandum and Articles of Association", confidence: official}
      - doc: co-company-pan
        cite: {source_id: rbi-kyc-md, excerpt: "Memorandum and Articles of Association 89 Permanent Account Number of the company", confidence: official}

  - id: co-gstin
    name: GST registration (GSTIN), Karnataka
    office: gst-proper-officer
    office_cite: {source_id: cgst-rule-9, excerpt: "The application shall be forwarded to the proper officer who shall examine the application and the accompanying documents", confidence: official}
    days: 7
    days_cite: {source_id: cgst-rule-9, excerpt: "approve the grant of registration to the applicant within a period of 1 [seven] working days from the date of submission of the application", confidence: official}
    days_unit: working_days
    note: working days
    # Rule 9(1) proviso: 30 days (unit "days", not "working days") when Aadhaar authentication is not done or physical
    # verification is ordered: "the registration shall be granted within thirty days of submission of application,
    # after physical verification of the place of business". Rule 9(2): REG-03 clarification notice within 7 working
    # days, reply in REG-04 within 7 working days, then approval within 7 working days (Rule 9(3)); deemed approval if no
    # action (Rule 9(5)). GSTIN can also be applied through SPICe+ AGILE-PRO-S (optional, FAQ 12e).
    # The CBIC FAQ (Ver.Rev.2.00) also lists business bank account details; it is NOT modelled as a requirement because
    # the same FAQ (11.3) allows a personal account until the business account is open.
    requires:
      - doc: co-company-pan
        cite: {source_id: cgst-rule-8, excerpt: "declare his Permanent Account Number, State or Union territory in Part A of FORM GST REG-01", confidence: official}
      - doc: co-registered-office-proof
        cite: {source_id: cbic-gst-faq-registration, excerpt: "Documentary proof of principal place of business", confidence: official}
        note: The registered office proof serves only if it is also the principal place of business in Karnataka.
      - doc: co-dsc
        cite: {source_id: cbic-gst-faq-registration, excerpt: "Valid Class II or Class III DSC of authorised signatory in case of companies and LLPs", confidence: official}

  - id: co-shop-establishment-ka
    name: Registration under the Karnataka Shops and Commercial Establishments Act, 1961 (Form A, e-Karmika)
    office: labour-inspector-ka
    office_cite: {source_id: ka-shops-act-1961-wb, excerpt: "Registration of all establishments is compulsory. Application in Form-A to be made to concerned labour Inspector", confidence: official}
    days: 7
    days_cite: {source_id: sakala-compendium-en, excerpt: "1 Registration under Labour/Senior 07 working Labour 35 Assistant 35 the Karnataka Labour Days Officer Working Labour Working Shops and Inspector", confidence: official}
    days_unit: working_days
    note: working days
    # Sakala 10.1 row 1; renewal is 10 working days (row 2). Not available through SPICe+ in Karnataka (FAQ 41: Delhi only).
    requires:
      - any_of: {id: co-establishment-address-proof-ka, label: "Address proof for the establishment (rental agreement / GST / BBMP Khata)"}
        cite: {source_id: ekarmika-home, excerpt: "Address Proof for the Establishment(Rental / agreement / GST / BBMP Khata)", confidence: official}
        options:
          - doc: co-registered-office-proof
            cite: {source_id: ekarmika-home, excerpt: "Address Proof for the Establishment(Rental / agreement / GST / BBMP Khata)", confidence: official}
          - doc: co-gstin
            cite: {source_id: ekarmika-home, excerpt: "Address Proof for the Establishment(Rental / agreement / GST / BBMP Khata)", confidence: official}
      - any_of: {id: co-incorporation-proof-ka-shops, label: "Incorporation Certificate or Memorandum (private limited company)"}
        cite: {source_id: ekarmika-home, excerpt: "Incorporation Certificate /Memorandum of Article (In Case of Private Ltd. Company)", confidence: official}
        options:
          - doc: co-spice-incorporation-certificate
            cite: {source_id: ekarmika-home, excerpt: "Incorporation Certificate /Memorandum of Article (In Case of Private Ltd. Company)", confidence: official}
          - doc: co-moa-aoa
            cite: {source_id: ekarmika-home, excerpt: "Incorporation Certificate /Memorandum of Article (In Case of Private Ltd. Company)", confidence: official}
      - any_of: {id: co-owner-id-proof-ka-shops, label: "Identity / address proof of the owner (Aadhaar, driving licence, voter card etc.)"}
        cite: {source_id: ekarmika-home, excerpt: "Identity / Address Proof of the owner(Aadhar card/ Driving license/Voter Card etc.)", confidence: official}
        note: Only Aadhaar is modelled; driving licence, voter card and others are also accepted.
        options:
          - doc: aadhaar
            cite: {source_id: ekarmika-home, excerpt: "Identity / Address Proof of the owner(Aadhar card/ Driving license/Voter Card etc.)", confidence: official}

  - id: co-professional-tax-ka
    name: Professional tax certificate of registration (employer), Karnataka
    office: pt-assessing-authority-ka
    office_cite: {source_id: prs-ka-pt-act-1976, excerpt: "shall obtain a certificate of registration from the assessing authority in the prescribed manner.", confidence: secondary}
    days: 30
    days_cite: {source_id: prs-ka-pt-act-1976, excerpt: "the assessing authority shall, after such inquiry as it may deem fit within thirty days of the receipt of the application", confidence: secondary}
    days_unit: calendar_days
    note: calendar days
    # Secondary: PRS copy of Act 35 of 1976, s.5(3); official copies (indiacode.nic.in 403, pt.kar.nic.in unreachable)
    # could not be saved, and later amendments to s.5 were not verified. For new companies the application goes through
    # SPICe+ AGILE-PRO-S (mandatory in Karnataka, FAQ 38); the PT portal's own document list was not captured.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Registration for Profession Tax shall be mandatory through SPICe+ only in respect of new companies incorporated in the State of Maharashtra, Karnataka and West Bengal.", confidence: official}
        note: Applied for inside the SPICe+ incorporation application, so it cannot come before incorporation.

schemes:
  - id: in-company-ready-to-invoice-gst
    name: Private limited company in Karnataka that can issue GST tax invoices
    authority: Ministry of Corporate Affairs and GST (CBIC / Commercial Taxes Department, Karnataka)
    note: A goal with no published window; the founder sets their own deadline.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Every company incorporated with effect from 23rd February, 2020 is required to make a n application for reservation of name and incorporation", confidence: official}
      - doc: co-gstin
        cite: {source_id: cgst-act-section-31, excerpt: "A registered person supplying taxable services shall, before or after the provision of service but within a prescribed period, issue a tax invoice", confidence: official}
      - doc: co-bank-current-account
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "would also be mandatorily required to apply for opening the company’s Bank account through the AGILE-PRO-S linked web form.", confidence: official}

  - id: in-company-ready-to-hire
    name: Private limited company in Karnataka registered to employ staff (shops & establishments + professional tax)
    authority: Department of Labour, Karnataka and Commercial Taxes Department, Karnataka
    note: >-
      A goal with no published window. EPFO and ESIC registration numbers are issued through SPICe+ itself (FAQ 39) and
      are not modelled as separate documents.
    requires:
      - doc: co-spice-incorporation-certificate
        cite: {source_id: mca-spice-plus-faqs-wb, excerpt: "Every company incorporated with effect from 23rd February, 2020 is required to make a n application for reservation of name and incorporation", confidence: official}
      - doc: co-shop-establishment-ka
        cite: {source_id: ka-shops-act-1961-wb, excerpt: "Registration of all establishments is compulsory.", confidence: official}
      - doc: co-professional-tax-ka
        cite: {source_id: prs-ka-pt-act-1976, excerpt: "Every employer (not being an officer of Government) liable to pay tax under section 4 shall obtain a certificate of registration", confidence: secondary}
