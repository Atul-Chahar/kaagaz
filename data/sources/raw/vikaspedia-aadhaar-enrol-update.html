0726172602_biometricsinaadhaar.png"/><meta name="twitter:site" content="@vikaspedia"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://aadhaar.vikaspedia.in?lgn=en"},{"@type":"ListItem","position":2,"name":"Aadhaar","item":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar?lgn=en"},{"@type":"ListItem","position":3,"name":"Aadhaar Enrolment and Update","item":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/aadhaar-enrolment-and-update?lgn=en"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/aadhaar-enrolment-and-update?lgn=en"},"headline":"Aadhaar Enrolment and Update","description":"Provides an overview information about Aadhaar Enrolment and Update.","image":"https://static.vikaspedia.in/mediastorage/filestorage/20250726172602_biometricsinaadhaar.png","author":{"@type":"Person","name":"Anuj Kumar"},"contributor":{"@type":"Person","name":"Anuj Kumar"},"keywords":["aadhaar update","aadhaar enrolment","enrollment id aadhaar","enrolment id","proof of identity and proof of address","authorized centre","uid","aadhaar","enrollment for aadhar","aadhaar biometrics","address proof","enrolment centre","aadhaar enrolment and update","identity proof","proof of relationship","enrolment form","aadhaar enrollment centre","uidai","acknowledgement slip","biometric data"],"articleBody":"<p>The Aadhaar enrolment process includes visiting Enrolment Centre, filling the enrolment form, getting demographic and biometric data captured, submitting proof of Identity and address documents, before collecting acknowledgement slip containing Enrolment ID.&nbsp;</p> \n<h3>Highlights of Aadhaar enrolment</h3> \n<ul> \n <li>Aadhaar enrolment is free of cost.</li> \n <li>You can go to any <a title=\"External website that opens in new window\" href=\"https://bookappointment.uidai.gov.in/\" target=\"_blank\" rel=\"noopener\">authorized Aadhaar enrolment centre</a> anywhere in India with your proof of identity and proof of address documents</li> \n <li>UIDAI process accepts wide range of PoI (Proof of Identity) and PoA (Proof of Address) documents. View the <a title=\"External website that opens in new window\" href=\"https://uidai.gov.in/images/commdoc/List_of_Supporting_Document_for_Aadhaar_Enrolment_and_Update.pdf\" target=\"_blank\" rel=\"noopener\">list of supporting documents</a>. Common proofs of identity and address are election photo ID card, Ration card, passport and driving license.</li> \n <li>Photo ID cards like PAN card and Govt ID cards are permissible for identity proof. Address proof documents also include electricity and landline telephone bills of the the last three months, among <a title=\"External website that opens in new window\" href=\"https://energy.vikaspedia.in/viewcontent/energy/policy-support/others?lgn=en\" target=\"_blank\" rel=\"noopener\" data-page-id=\"2183\">others</a>.&nbsp;</li> \n <li>Even if someone in a family does not have individual valid documents, the individual seeking to enrol can still enrol if his/her name exists in family entitlement document. In this case, the Head of Family mentioned in entitlement document needs to be enrolled first with valid PoI &amp; PoA document. The head of the Family can then introduce other members in the family while they are enrolling. Please View the <a title=\"External website that opens in new window\" href=\"https://uidai.gov.in/images/commdoc/List_of_Supporting_Document_for_Aadhaar_Enrolment_and_Update.pdf\" target=\"_blank\" rel=\"noopener\">list of supporting documents.&nbsp;&nbsp;</a></li> \n <li>There are two approaches for Aadhaar enrolment: Document Based and Head of Family based. \n  <ul> \n   <li>Document Based - Submission of one valid Proof of Identity (PoI) document and one valid Proof of Address (PoA) document</li> \n   <li>Head of Family (HoF) Based - Head of Family (HoF) may introduce family members by means of documents, which establish the Proof of Relationship (PoR).&nbsp;</li> \n  </ul> </li> \n <li>&nbsp;You need to enrol only once, as multiple enrolments will result in rejections unless it is advised by UIDAI.</li> \n <li>The waiting time for getting an Aadhaar by an individual above the age of 18 years is 180 days from the date of enrolment.</li> \n</ul> \n<p><img style=\"max-width: 100%; height: auto; display: block; margin-left: auto; margin-right: auto;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20250726172602_biometricsinaadhaar.png\" alt=\"Uploaded Image\"></p> \n<p><strong>Source : <a title=\"External website that opens in new window\" href=\"https://uidai.gov.in/\" target=\"_blank\" rel=\"noopener\">UIDAI</a></strong></p>","publisher":{"@type":"GovernmentOrganization","name":"CDAC-Hyderabad","url":"https://www.cdac.in/","logo":{"@type":"ImageObject","url":"https://www.cdac.in/img/cdac-logo.png"}},"datePublished":"2025-07-26T11:48:12.000+00:00","dateModified":"2026-04-09T11:44:36.000+00:00","inLanguage":"en","isPartOf":{"@type":"WebSite","name":"Vikaspedia - Aadhaar","url":"https://aadhaar.vikaspedia.in"},"speakable":{"@type":"SpeakableSpecification","xpath":["//article//h1","//article//p[1]"]}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Vikaspedia - English | Multisectorial Knowledge Repository","description":"Provides an overview information about Aadhaar Enrolment and Update.","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/aadhaar-enrolment-and-update?lgn=en","inLanguage":"en","publisher":{"@type":"GovernmentOrganization","name":"Centre for Development of Advanced Computing (C-DAC).","url":"https://www.cdac.in/","parentOrganization":{"@type":"GovernmentOrganization","name":"Ministry of Electronics and Information Technology (MeitY)","url":"https://www.meity.go our-aadhaar?lgn=en"},{"lgn":"en","context_path":"/aadhaar/aadhaar-seva-kendra","domain":"Aadhaar","language":"English","id":421392,"title":"Aadhaar Seva Kendra","summery":"Provides information about Aadhaar Seva Kendra.","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/aadhaar-seva-kendra?lgn=en"},{"lgn":"en","context_path":"/aadhaar/my-aadhaar/aadhaar-biometric-updates-for-children","domain":"Aadhaar","language":"English","id":421808,"title":"Aadhaar Biometric Updates for Children","summery":"Provides information about Aadhaar Biometric Updates for Children","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/my-aadhaar/aadhaar-biometric-updates-for-children?lgn=en"},{"lgn":"en","context_path":"/aadhaar/mandatory-biometric-update/mandatory-biometric-update","domain":"Aadhaar","language":"English","id":422386,"title":"Mandatory Biometric Update","summery":"Children need to update their Biometrics (fingerprint, iris, photo) on attaining the age of 5 and 15 years","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/mandatory-biometric-update/mandatory-biometric-update?lgn=en"},{"lgn":"en","context_path":"/aadhaar/aadhaar-related-documents/list-of-acceptable-documents-for-aadhaar-enrolment","domain":"Aadhaar","language":"English","id":422412,"title":"List of Acceptable Documents for Aadhaar enrolment","summery":"If you are looking for Aadhaar enrolment or update your Aadhaar, here is a full list of acceptable documents for these purposes.","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/aadhaar-related-documents/list-of-acceptable-documents-for-aadhaar-enrolment?lgn=en"},{"lgn":"en","context_path":"/aadhaar/my-aadhaar/charges-for-aadhaar-services","domain":"Aadhaar","language":"English","id":422548,"title":"Charges for Aadhaar Services","summery":"Enrolment for Aadhaar is completely free of cost for all residents, including children. Other services of Aadhaar, like ordering Aadhaar PVC Card, taking print-out of Aadhaar from ASK, demographic \u0026 biometric updates in Aadhaar are available at a nominal charge.","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/my-aadhaar/charges-for-aadhaar-services?lgn=en"},{"lgn":"en","context_path":"/aadhaar/my-aadhaar/aadhaar-app/add-or-update-email-in-aadhaar-through-aadhaar-app-for-free","domain":"Aadhaar","language":"English","id":424226,"title":"Add or Update email in Aadhaar through Aadhaar App for FREE","summery":"Unique Identification Authority of India (UIDAI) has now allowed people to add or update their email ID in Aadhaar directly through the Aadhaar App, eliminating the need to visit an Aadhaar centre. This is a free service via the Aadhaar App only, effective 1 July 2026 for a period of six months, making it easier than ever for residents to keep their Aadhaar information up to date.","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/my-aadhaar/aadhaar-app/add-or-update-email-in-aadhaar-through-aadhaar-app-for-free?lgn=en"},{"lgn":"en","context_path":"/aadhaar/my-aadhaar/aadhaar-app/aadhaar-app-witnessing-strong-adoption,-improving-convenience-for-people","domain":"Aadhaar","language":"English","id":424470,"title":"Aadhaar App witnessing strong adoption, improving convenience for people","summery":"Aadhaar App is observing wider adoption from people for making Aadhaar related services available at their fingertips. It has helped over 49 lakh mobile number updates \u0026 11.65 lakh address updates through the Aadhaar App, eliminating the need to visit a physical centre. So far, over 4 crore people have downloaded the Aadhaar App. ","url":"https://aadhaar.vikaspedia.in/viewcontent/aadhaar/my-aadhaar/aadhaar-app/aadhaar-app-witnessing-strong-adoption,-improving-convenience-for-people?lgn=en"}],"content":"\u003cp\u003eThe Aadhaar enrolment process includes visiting Enrolment Centre, filling the enrolment form, getting demographic and biometric data captured, submitting proof of Identity and address documents, before collecting acknowledgement slip containing Enrolment ID.\u0026nbsp;\u003c/p\u003e \n\u003ch3\u003eHighlights of Aadhaar enrolment\u003c/h3\u003e \n\u003cul\u003e \n \u003cli\u003eAadhaar enrolment is free of cost.\u003c/li\u003e \n \u003cli\u003eYou can go to any \u003ca title=\"External website that opens in new window\" href=\"https://bookappointment.uidai.gov.in/\" target=\"_blank\" rel=\"noopener\"\u003eauthorized Aadhaar enrolment centre\u003c/a\u003e anywhere in India with your proof of identity and proof of address documents\u003c/li\u003e \n \u003cli\u003eUIDAI process accepts wide range of PoI (Proof of Identity) and PoA (Proof of Address) documents. View the \u003ca title=\"External website that opens in new window\" href=\"https://uidai.gov.in/images/commdoc/List_of_Supporting_Document_for_Aadhaar_Enrolment_and_Update.pdf\" target=\"_blank\" rel=\"noopener\"\u003elist of supporting documents\u003c/a\u003e. Common proofs of identity and address are election photo ID card, Ration card, passport and driving license.\u003c/li\u003e \n \u003cli\u003ePhoto ID cards like PAN card and Govt ID cards are permissible for identity proof. Address proof documents also include electricity and landline telephone bills of the the last three months, among \u003ca title=\"External website that opens in new window\" href=\"https://energy.vikaspedia.in/viewcontent/energy/policy-support/others?lgn=en\" target=\"_blank\" rel=\"noopener\" data-page-id=\"2183\"\u003eothers\u003c/a\u003e.\u0026nbsp;\u003c/li\u003e \n \u003cli\u003eEven if someone in a family does not have individual valid documents, the individual seeking to enrol can still enrol if his/her name exists in family entitlement document. In this case, the Head of Family mentioned in entitlement document needs to be enrolled first with valid PoI \u0026amp; PoA document. The head of the Family can then introduce other members in the family while they are enrolling. Please View the \u003ca title=\"External website that opens in new window\" href=\"https://uidai.gov.in/images/commdoc/List_of_Supporting_Document_for_Aadhaar_Enrolment_and_Update.pdf\" target=\"_blank\" rel=\"noopener\"\u003elist of supporting documents.\u0026nbsp;\u0026nbsp;\u003c/a\u003e\u003c/li\u003e \n \u003cli\u003eThere are two approaches for Aadhaar enrolment: Document Based and Head of Family based. \n  \u003cul\u003e \n   \u003cli\u003eDocument Based - Submission of one valid Proof of Identity (PoI) document and one valid Proof of Address (PoA) document\u003c/li\u003e \n   \u003cli\u003eHead of Family (HoF) Based - Head of Family (HoF) may introduce family members by means of documents, which establish the Proof of Relationship (PoR).\u0026nbsp;\u003c/li\u003e \n  \u003c/ul\u003e \u003c/li\u003e \n \u003cli\u003e\u0026nbsp;You need to enrol only once, as multiple enrolments will result in rejections unless it is advised by UIDAI.\u003c/li\u003e \n \u003cli\u003eThe waiting time for getting an Aadhaar by an individual above the age of 18 years is 180 days from the date of enrolment.\u003c/li\u003e \n\u003c/ul\u003e \n\u003cp\u003e\u003cimg style=\"max-width: 100%; height: auto; display: block; margin-left: auto; margin-right: auto;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20250726172602_biometricsinaadhaar.png\" alt=\"Uploaded Image\"\u003e\u003c/p\u003e \n\u003cp\u003e\u003cstrong\u003eSource : \u003ca title=\"External website that opens in new window\" href=\"https://uidai.gov.in/\" target=\"_blank\" rel=\"noopener\"\u003eUIDAI\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e","lgn":"en","depth":2,"updated_at":"2026-04-09T11:44:36.000+00:00","subHeading":"\u003col\u003e\u003cli\u003e\u003ca href='#section1' \u003eHighlights of Aadhaar enrolment\u003c/a\u003e\u003c/li\u003e\u003c/ol\u003e","domain":26,"context_type":"document","isInfoBotPage":false,"id":421391,"isCopy":false,"relatedKeywords":["aadhaar update","aadhaar enrolment","enrollment id aadhaar","enrolment id","proof of identity and proof of address","authori
