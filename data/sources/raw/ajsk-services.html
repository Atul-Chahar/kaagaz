                    <div class="card-body">
                        <p class="card-text mb-2">
                            <label for="OnlineServices_Para1">The Atalji Janasnehi Project aims to provide various services to the citizens through the Atalji Janasnehi Kendras(Nadakacheries) which are easily access to the citizens. Some of the services are also made available through the online portal. It uses backend computerization to e-enable the delivery of the services and ensures transparency and uniform application of rules. The electronic delivery of the services enables the citizen to know the status of their applications and the competent authority to monitor the pendency on real-time leading to the overall efficiency of the process is improved and enable the department to provide the services to the citizen in an effective manner. The Atalji Janasnehi Kendras Project provides the various services to the citizen like issuing of the Caste &amp; Income, land &amp; Agriculture related certificates, social security pensions. The list of 42 ONLINE services provided under Atalji Janasnehi Kendras Project follows.</label>
