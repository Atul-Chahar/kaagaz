pack:
  id: in-ka-scholarships
  name: Scholarships for students in Karnataka, India
  jurisdiction: Karnataka, India (state schemes) and Government of India (central schemes on NSP)
  language: en
  currency: INR
  timezone: Asia/Kolkata
  version: "2026.10.17"
# Who this pack models: a college student in Karnataka applying for a post-matric scholarship.
models: A college student in Karnataka (regular degree course) applying for a post-matric scholarship.
exclude_conditions:
  - condition: Only for persons born on or after 1.10.2023
    reason: A college student was born long before 1 Oct 2023, so this Aadhaar rule does not apply to them.
# Presentation only: how the "tick what you already hold" list is grouped on the Start screen.
groups:
  - label: Identity and bank
    docs: [aadhaar, aadhaar-face-authentication, bank-account, bank-account-aadhaar-seeded, aadhaar-seeding-consent-form, pan-card, form-60, voter-id, driving-licence, passport, npr-letter, nrega-job-card, proof-of-identity]
  - label: Certificates from the taluk office
    docs: [caste-income-certificate-ka, caste-certificate-ka, income-certificate-ka, residence-certificate-ka, ration-card-ka, birth-certificate, caste-certificate, income-certificate, proof-of-residence, income-proof, electricity-bill]
  - label: From your school and college
    docs: [sslc-marks-card, marks-card-previous, study-certificate, fee-receipt, hostel-certificate, admission-proof, school-leaving-certificate, university-registration-number, institution-certificate-uidai-format]
  - label: Scholarship portal steps
    docs: [nsp-otr, ssp-student-account, ssp-e-attested-documents]
# Synthetic demo profile. Not a real person. Shown everywhere as "Example student".
example_student:
  label: Example student
  scheme_id: ka-ssp-fee-reimbursement-minority
  about: >-
    A made-up second-year degree student in Karnataka who lives in a college hostel and applies for Fee Reimbursement
    for Minorities on the State Scholarship Portal. They already hold their Aadhaar, an Aadhaar-seeded bank account,
    college papers, an SSP account and e-attested documents, and an identity proof. They do not yet hold a caste and
    income certificate or a proof of residence.
  holdings: [aadhaar, bank-account, bank-account-aadhaar-seeded, sslc-marks-card, marks-card-previous, study-certificate,
             fee-receipt, hostel-certificate, university-registration-number, ssp-student-account, ssp-e-attested-documents,
             proof-of-identity]
