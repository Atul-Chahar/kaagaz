[project]
name = "kaagaz"
version = "0.1.0"
description = "Kaagaz: document chain planner for scholarships, on FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "falkordb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaagaz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real FalkorDB (docker compose)"]

[tool.ruff]
line-length = 110
